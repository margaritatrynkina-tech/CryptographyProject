[pytest]
timeout = 30
markers =
    fast: fast tests (unit tests without I/O)
    crypto: cryptography-related tests
    slow: slow tests (integration, performance)
    perf: performance tests
    property: property-based tests (hypothesis)

addopts = -m "fast or crypto" -v --tb=short -q

[coverage:run]
omit =
    src/gui/*
    src/gui/**/*
    tests/test_gui_imports.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__:
    pass